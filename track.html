<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi commande — URBAN DZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="URBAN DZ">
  <meta property="og:title" content="Suivi commande — URBAN DZ">
  <meta property="og:description" content="Suivez votre commande URBAN DZ avec votre numéro et téléphone.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1c1a17">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1a17'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='14' fill='%23b08d57' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head" style="text-align:center">
      <h1 data-i18n="track_title"></h1>
      <p style="color:var(--ink-soft)" data-i18n="track_sub"></p>
    </div>
    <form class="track-form" id="track-form">
      <div class="field">
        <label for="t-id" data-i18n="order_no"></label>
        <input id="t-id" type="number" min="1" required>
      </div>
      <div class="field">
        <label for="t-phone" data-i18n="co_phone"></label>
        <input id="t-phone" inputmode="tel" required placeholder="05 XX XX XX XX">
      </div>
      <button class="btn accent block" data-i18n="track_btn"></button>
      <p class="promo-msg bad" id="t-msg" hidden></p>
    </form>
    <div id="t-result"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/tracking.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/track.js"></script>
</body>
</html>
