<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique — URBAN DZ</title>
  <meta name="description" content="Toute la collection homme URBAN DZ : t-shirts, chemises, jeans, vestes. Paiement à la livraison en Algérie.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="URBAN DZ">
  <meta property="og:title" content="Boutique — URBAN DZ">
  <meta property="og:description" content="Toute la collection homme URBAN DZ : t-shirts, chemises, jeans, vestes. Paiement à la livraison en Algérie.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1c1a17">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1a17'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='14' fill='%23b08d57' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-head"><h1 data-i18n="shop_title"></h1></div>

    <div class="shop-layout">
      <aside class="filters">
        <div>
          <h4 data-i18n="filter_cat"></h4>
          <ul class="filter-list" id="cat-list">
            <li><a href="shop.html" id="cat-all" data-i18n="filter_all"></a></li>
          </ul>
        </div>
      </aside>

      <section>
        <div class="shop-tools">
          <div class="search-box">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b645c" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="search" data-i18n-ph="search_ph">
          </div>
          <div class="select-wrap">
            <select id="sort">
              <option value="new" data-i18n="sort_new"></option>
              <option value="asc" data-i18n="sort_asc"></option>
              <option value="desc" data-i18n="sort_desc"></option>
              <option value="pop" data-i18n="sort_pop"></option>
            </select>
          </div>
          <span class="results-count" id="count"></span>
        </div>
        <div class="grid-products" id="grid"></div>
        <p id="empty" style="display:none;color:var(--ink-soft);padding:40px 0;text-align:center" data-i18n="no_results"></p>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/tracking.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
