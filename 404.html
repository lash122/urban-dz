<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — URBAN DZ</title>
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="URBAN DZ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1a17'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='14' fill='%23b08d57' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="container" style="min-height:80vh;display:grid;place-items:center;text-align:center">
    <div>
      <a class="logo" href="/" style="font-size:1.6rem">URBAN<span>DZ</span></a>
      <h1 id="nf-title" style="font-size:clamp(2.5rem,8vw,4.5rem);margin:24px 0 8px;color:var(--accent)">404</h1>
      <p id="nf-text" style="color:var(--ink-soft);max-width:42ch;margin:0 auto 30px"></p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn accent" id="nf-shop" href="/shop.html"></a>
        <a class="btn ghost" id="nf-track" href="/track.html"></a>
      </div>
    </div>
  </main>

  <script>
    // no framework, no database — pick the visitor's language and show buttons
    var ar = (navigator.language || '').toLowerCase().indexOf('ar') !== -1;
    document.documentElement.lang = ar ? 'ar' : 'fr';
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    document.title = ar ? 'الصفحة غير موجودة — URBAN DZ' : 'Page introuvable — URBAN DZ';
    document.getElementById('nf-title').textContent = '404';
    document.getElementById('nf-text').textContent = ar
      ? 'هذه الصفحة غير موجودة أو تم نقلها. لا تقلق — المتجر في انتظارك.'
      : 'Cette page n\'existe pas ou a été déplacée. Pas d\'inquiétude — la boutique vous attend.';
    document.getElementById('nf-shop').textContent = ar ? 'تسوّق الآن' : 'Aller à la boutique';
    document.getElementById('nf-track').textContent = ar ? 'تتبع طلبي' : 'Suivre ma commande';
  </script>
</body>
</html>
